name: Task
description: A piece of technical work inside a story. You can also use "Create sub-issue" on the story itself.
title: "[HN-xx] "
labels: ["type:task"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent story
      placeholder: "#23"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Frontend
        - DevOps
        - Tests
        - Docs
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What needs to be done
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate (hours)
      placeholder: e.g. 3
